<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCSR God Run Simulator</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --list-bg: #161b22;
            --accent-gold: #e3b341;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --border-color: #30363d;
            --hover-bg: #21262d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { max-width: 600px; width: 100%; }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 { color: var(--text-main); margin-bottom: 8px; font-size: 24px; font-weight: 600; }
        p { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; }

        .controls {
            display: flex; gap: 10px; justify-content: center; align-items: center;
        }

        input {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            width: 120px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus { border-color: var(--accent-gold); }

        button.run-btn {
            background-color: var(--text-main);
            color: var(--bg-color);
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button.run-btn:hover { background-color: #ffffff; }
        button.run-btn:disabled { background-color: var(--border-color); color: var(--text-muted); cursor: not-allowed; }

        #status-container { text-align: center; margin: 15px 0; font-size: 13px; color: var(--accent-gold); height: 20px; }

        .progress-bar { width: 100%; height: 4px; background-color: var(--border-color); border-radius: 2px; overflow: hidden; display: none; }
        .progress-fill { height: 100%; background-color: var(--accent-gold); width: 0%; transition: width 0.1s; }

        .results-list {
            background-color: var(--list-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .segment-item {
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.2s;
        }

        .segment-item:last-child { border-bottom: none; }
        .segment-item:hover { background-color: var(--hover-bg); }

        .segment-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
        }

        .segment-left { display: flex; align-items: center; gap: 15px; }
        
        .bullet {
            width: 8px; height: 8px;
            border-radius: 50%;
            border: 2px solid var(--accent-gold);
            background-color: transparent;
        }

        .segment-name { font-size: 15px; font-weight: 500; color: var(--text-main); }
        
        .segment-right { display: flex; align-items: center; gap: 15px; }
        
        .segment-time { font-family: monospace; font-size: 15px; color: var(--text-main); }

        .info-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            width: 24px; height: 24px;
            border-radius: 50%;
            font-size: 12px;
            font-family: serif;
            font-style: italic;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }

        .info-btn:hover { border-color: var(--text-main); color: var(--text-main); }

        .segment-details {
            display: none;
            padding: 0 20px 20px 43px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .detail-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
        .detail-row span:first-child { color: #6e7681; }

        .total-box {
            text-align: center;
            padding: 20px;
            border-top: 1px solid var(--border-color);
            display: none;
        }

        .total-title { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 8px; }
        .total-time { font-size: 28px; font-family: monospace; color: var(--accent-gold); font-weight: 600; }
        .route-winner { font-size: 13px; color: var(--text-muted); margin-top: 5px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>God Run Simulator</h1>
        <p>Calculates the absolute fastest continuous route.</p>
        <div class="controls">
            <input type="number" id="run-count" min="1" max="150" value="100" placeholder="Runs">
            <button class="run-btn" id="run-btn" onclick="startCompiler()">Simulate</button>
        </div>
        <div id="status-container"></div>
        <div class="progress-bar" id="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </header>

    <div id="results" class="results-list"></div>
    
    <div id="total" class="total-box">
        <div class="total-title">Theoretical Limit</div>
        <div class="total-time" id="total-time-display">00:00.000</div>
        <div id="route-winner" class="route-winner"></div>
    </div>
</div>

<script>
    const DISPLAY_NAMES = {
        "world_spawn": "World Spawn",
        "story.enter_the_nether": "Nether Enter",
        "nether.find_bastion": "Bastion",
        "nether.find_fortress": "Fortress",
        "nether.obtain_blaze_rod": "First Rod",
        "projectelo.timeline.blind_travel": "Blind Travel",
        "story.follow_ender_eye": "Stronghold",
        "story.enter_the_end": "End Enter",
        "projectelo.timeline.dragon_death": "Finish"
    };

    const EDGES = {
        "S_N":  { start: "world_spawn", target: "story.enter_the_nether" },
        "N_B":  { start: "story.enter_the_nether", target: "nether.find_bastion" },
        "B_F":  { start: "nether.find_bastion", target: "nether.find_fortress" },
        "F_R":  { start: "nether.find_fortress", target: "nether.obtain_blaze_rod" },
        "R_BL": { start: "nether.obtain_blaze_rod", target: "projectelo.timeline.blind_travel" },
        "N_F":  { start: "story.enter_the_nether", target: "nether.find_fortress" },
        "R_B":  { start: "nether.obtain_blaze_rod", target: "nether.find_bastion" },
        "B_BL": { start: "nether.find_bastion", target: "projectelo.timeline.blind_travel" },
        "BL_ST": { start: "projectelo.timeline.blind_travel", target: "story.follow_ender_eye" },
        "ST_E":  { start: "story.follow_ender_eye", target: "story.enter_the_end" },
        "E_F":   { start: "story.enter_the_end", target: "projectelo.timeline.dragon_death" }
    };

    const ROUTE_BASTION_FIRST = ["S_N", "N_B", "B_F", "F_R", "R_BL", "BL_ST", "ST_E", "E_F"];
    const ROUTE_FORTRESS_FIRST = ["S_N", "N_F", "F_R", "R_B", "B_BL", "BL_ST", "ST_E", "E_F"];

    function msToStr(ms) {
        if (ms == null) return "00:00.000";
        ms = Math.max(0, ms);
        let mins = Math.floor(ms / 60000);
        let secs = Math.floor((ms % 60000) / 1000);
        let millis = Math.floor(ms % 1000);
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}.${millis.toString().padStart(3, '0')}`;
    }

    const delay = ms => new Promise(resolve => setTimeout(resolve, ms));

    function toggleInfo(index) {
        const detailsDiv = document.getElementById(`details-${index}`);
        if (detailsDiv.style.display === "block") {
            detailsDiv.style.display = "none";
        } else {
            detailsDiv.style.display = "block";
        }
    }

    async function startCompiler() {
        const btn = document.getElementById("run-btn");
        const status = document.getElementById("status-container");
        const resultsDiv = document.getElementById("results");
        const totalBox = document.getElementById("total");
        const routeWinnerDisplay = document.getElementById("route-winner");
        const progressBar = document.getElementById("progress-bar");
        const progressFill = document.getElementById("progress-fill");
        
        let countInput = parseInt(document.getElementById("run-count").value);
        if (isNaN(countInput) || countInput < 1 || countInput > 150) {
            alert("Please enter a valid number between 1 and 150.");
            return;
        }

        btn.disabled = true;
        resultsDiv.innerHTML = "";
        totalBox.style.display = "none";
        routeWinnerDisplay.style.display = "none";
        progressBar.style.display = "block";
        progressFill.style.width = "0%";
        
        let bestEdges = {};
        Object.keys(EDGES).forEach(key => bestEdges[key] = null);

        try {
            status.innerText = `Fetching leaderboards...`;
            const lbRes = await fetch("https://api.mcsrranked.com/record-leaderboard");
            if (!lbRes.ok) throw new Error("Failed to fetch leaderboard.");
            const lbJson = await lbRes.json();
            
            let matches = lbJson.data.slice(0, countInput).map((match, index) => ({
                id: match.id, rank: index + 1
            }));

            for (let i = 0; i < matches.length; i++) {
                let match = matches[i];
                status.innerText = `Analyzing run ${i + 1}/${matches.length}...`;
                progressFill.style.width = `${((i + 1) / matches.length) * 100}%`;

                try {
                    const matchRes = await fetch(`https://api.mcsrranked.com/matches/${match.id}`);
                    if (!matchRes.ok) continue;
                    
                    const matchJson = await matchRes.json();
                    const matchData = matchJson.data || {};
                    const winnerUuid = matchData.result?.uuid;
                    if (!winnerUuid) continue;

                    let playerName = "Unknown";
                    (matchData.players || []).forEach(p => { if (p.uuid === winnerUuid) playerName = p.nickname; });

                    let pTimes = { "world_spawn": 0 };
                    (matchData.timelines || []).forEach(t => {
                        if (t.uuid === winnerUuid && t.type && t.time != null) {
                            if (!(t.type in pTimes) || t.time < pTimes[t.type]) pTimes[t.type] = t.time;
                        }
                    });

                    Object.keys(EDGES).forEach(edgeKey => {
                        let startId = EDGES[edgeKey].start;
                        let targetId = EDGES[edgeKey].target;

                        if (startId in pTimes && targetId in pTimes) {
                            let duration = pTimes[targetId] - pTimes[startId];
                            if (duration >= 0) {
                                if (bestEdges[edgeKey] == null || duration < bestEdges[edgeKey].duration) {
                                    bestEdges[edgeKey] = {
                                        duration: duration,
                                        startTime: pTimes[startId],
                                        targetTime: pTimes[targetId],
                                        player: playerName,
                                        runRank: match.rank,
                                        startName: DISPLAY_NAMES[startId],
                                        targetName: DISPLAY_NAMES[targetId]
                                    };
                                }
                            }
                        }
                    });
                } catch (e) {}
                await delay(50);
            }

            status.innerText = ""; 
            progressBar.style.display = "none";

            let bastionFirstSum = 0, fortressFirstSum = 0;
            let validBastion = true, validFortress = true;

            ROUTE_BASTION_FIRST.forEach(edge => { if (!bestEdges[edge]) validBastion = false; else bastionFirstSum += bestEdges[edge].duration; });
            ROUTE_FORTRESS_FIRST.forEach(edge => { if (!bestEdges[edge]) validFortress = false; else fortressFirstSum += bestEdges[edge].duration; });

            let winningRoute = [], winningSum = 0, winningName = "";

            if (validBastion && (!validFortress || bastionFirstSum <= fortressFirstSum)) {
                winningRoute = ROUTE_BASTION_FIRST; winningSum = bastionFirstSum; winningName = "Bastion First Strategy";
            } else if (validFortress) {
                winningRoute = ROUTE_FORTRESS_FIRST; winningSum = fortressFirstSum; winningName = "Fortress First Strategy";
            } else {
                status.innerText = "Error: Not enough data for a complete run.";
                btn.disabled = false;
                return;
            }

            winningRoute.forEach((edgeKey, index) => {
                const info = bestEdges[edgeKey];
                const item = document.createElement("div");
                item.className = "segment-item";
                
                item.innerHTML = `
                    <div class="segment-main">
                        <div class="segment-left">
                            <span class="bullet"></span>
                            <span class="segment-name">${info.targetName}</span>
                        </div>
                        <div class="segment-right">
                            <span class="segment-time">${msToStr(info.duration)}</span>
                            <button class="info-btn" onclick="toggleInfo(${index})">i</button>
                        </div>
                    </div>
                    <div class="segment-details" id="details-${index}">
                        <div class="detail-row"><span>Runner</span> <span>${info.player} (#${info.runRank} Overall)</span></div>
                        <div class="detail-row"><span>Path</span> <span>${info.startName} &rarr; ${info.targetName}</span></div>
                        <div class="detail-row"><span>Timeline</span> <span>${msToStr(info.startTime)} &rarr; ${msToStr(info.targetTime)}</span></div>
                    </div>
                `;
                resultsDiv.appendChild(item);
            });

            document.getElementById("total-time-display").innerText = msToStr(winningSum);
            routeWinnerDisplay.innerText = `Fastest Path: ${winningName}`;
            routeWinnerDisplay.style.display = "block";
            totalBox.style.display = "block";

        } catch (error) {
            status.innerText = `Error: ${error.message}`;
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
