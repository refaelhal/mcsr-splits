<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCSR God Run Simulator</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #1a1d24;
            --accent-gold: #eab308;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --highlight-bg: #1e293b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { max-width: 700px; width: 100%; }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        h1 { color: var(--text-main); margin-bottom: 10px; font-size: 26px; font-weight: 600; letter-spacing: -0.5px; }
        p { color: var(--text-muted); font-size: 15px; margin-bottom: 25px; }

        .controls { display: flex; gap: 12px; justify-content: center; align-items: center; flex-wrap: wrap; }

        input {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: white; padding: 12px 16px; border-radius: 8px; font-size: 15px; width: 160px; outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: var(--accent-gold); }

        button.run-btn {
            background-color: var(--text-main); color: var(--bg-color); border: none; padding: 12px 24px;
            border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background-color 0.2s;
        }
        button.run-btn:hover { background-color: #ffffff; }
        button.run-btn:disabled { background-color: var(--border-color); color: var(--text-muted); cursor: not-allowed; }

        #status-container { text-align: center; margin-top: 20px; font-size: 14px; font-weight: 500; color: var(--text-muted); height: 20px; }
        .progress-bar { width: 100%; height: 4px; background-color: var(--border-color); border-radius: 2px; margin-top: 20px; overflow: hidden; display: none; }
        .progress-fill { height: 100%; background-color: var(--accent-gold); width: 0%; transition: width 0.1s; }

        .results-grid { display: flex; flex-direction: column; gap: 16px; margin-bottom: 40px; }

        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .card-main {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 25px; background-color: var(--card-bg);
        }

        .card-info-group { display: flex; flex-direction: column; gap: 6px; }
        .card-title { font-size: 18px; font-weight: 600; color: var(--text-main); }
        .card-runner { font-size: 14px; color: var(--text-muted); }
        
        .card-time-group { display: flex; align-items: center; gap: 20px; }
        .card-time { font-size: 18px; font-weight: 600; color: var(--accent-gold); font-family: ui-monospace, monospace; }

        .info-btn {
            background-color: transparent; color: var(--text-muted); border: 1px solid var(--border-color);
            width: 32px; height: 32px; border-radius: 6px; font-size: 14px; font-style: italic; font-family: serif;
            cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .info-btn:hover { background-color: var(--border-color); color: var(--text-main); }

        .card-details {
            display: none; padding: 30px 25px; background-color: var(--bg-color);
            border-top: 1px solid var(--border-color);
        }

        .stats-row {
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 35px;
        }
        .stat-item {
            background: var(--card-bg); padding: 15px; border-radius: 8px; border: 1px solid var(--border-color);
            display: flex; flex-direction: column; gap: 6px;
        }
        .stat-label { font-size: 12px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; font-weight: 500; }
        .stat-value { font-weight: 600; color: var(--text-main); font-size: 14px; }

        .section-title { font-size: 14px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; margin-bottom: 20px; font-weight: 600; }
        
        /* Elegant Vertical Timeline */
        .run-timeline {
            margin-left: 10px;
            padding-left: 25px;
            border-left: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .timeline-step {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .timeline-step::before {
            content: '';
            position: absolute;
            left: -32px; /* Align perfectly over the border */
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            background: var(--bg-color);
            border: 2px solid var(--accent-gold);
            border-radius: 50%;
        }

        .step-name { font-size: 15px; font-weight: 500; color: var(--text-main); }
        .step-time { font-family: ui-monospace, monospace; font-size: 14px; color: var(--text-muted); }

        .total-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color); border-radius: 12px; padding: 35px; text-align: center;
            display: none; margin-top: 20px;
        }
        .total-title { color: var(--text-muted); font-size: 14px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; font-weight: 600; }
        .total-time { font-size: 42px; font-weight: 600; color: var(--accent-gold); font-family: ui-monospace, monospace; letter-spacing: -1px; }
        .route-winner { font-size: 15px; color: var(--text-main); margin-top: 15px; font-weight: 500; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>God Run Simulator</h1>
        <p>Calculates the absolute fastest continuous route from top ranked matches.</p>
        <div class="controls">
            <input type="number" id="run-count" min="1" max="150" value="100" placeholder="Runs (1-150)">
            <button class="run-btn" id="run-btn" onclick="startCompiler()">Simulate Route</button>
        </div>
        <div class="progress-bar" id="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div id="status-container"></div>
    </header>

    <div id="results" class="results-grid"></div>

    <div id="total" class="total-box">
        <div class="total-title">Theoretical Continuous Limit</div>
        <div class="total-time" id="total-time-display">00:00.000</div>
        <div id="route-winner" class="route-winner"></div>
    </div>
</div>

<script>
    const DISPLAY_NAMES = {
        "world_spawn": "World Spawn",
        "story.enter_the_nether": "Nether Enter",
        "nether.find_bastion": "Bastion",
        "nether.find_fortress": "Fortress",
        "nether.obtain_blaze_rod": "First Rod",
        "projectelo.timeline.blind_travel": "Blind Travel",
        "story.follow_ender_eye": "Stronghold",
        "story.enter_the_end": "End Enter",
        "projectelo.timeline.dragon_death": "Finish"
    };

    const EDGES = {
        "S_N":  { start: "world_spawn", target: "story.enter_the_nether" },
        "N_B":  { start: "story.enter_the_nether", target: "nether.find_bastion" },
        "B_F":  { start: "nether.find_bastion", target: "nether.find_fortress" },
        "F_R":  { start: "nether.find_fortress", target: "nether.obtain_blaze_rod" },
        "R_BL": { start: "nether.obtain_blaze_rod", target: "projectelo.timeline.blind_travel" },
        "N_F":  { start: "story.enter_the_nether", target: "nether.find_fortress" },
        "R_B":  { start: "nether.obtain_blaze_rod", target: "nether.find_bastion" },
        "B_BL": { start: "nether.find_bastion", target: "projectelo.timeline.blind_travel" },
        "BL_ST": { start: "projectelo.timeline.blind_travel", target: "story.follow_ender_eye" },
        "ST_E":  { start: "story.follow_ender_eye", target: "story.enter_the_end" },
        "E_F":   { start: "story.enter_the_end", target: "projectelo.timeline.dragon_death" }
    };

    const ROUTE_BASTION_FIRST = ["S_N", "N_B", "B_F", "F_R", "R_BL", "BL_ST", "ST_E", "E_F"];
    const ROUTE_FORTRESS_FIRST = ["S_N", "N_F", "F_R", "R_B", "B_BL", "BL_ST", "ST_E", "E_F"];

    function msToStr(ms) {
        if (ms == null) return "00:00.000";
        ms = Math.max(0, ms);
        let mins = Math.floor(ms / 60000);
        let secs = Math.floor((ms % 60000) / 1000);
        let millis = Math.floor(ms % 1000);
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}.${millis.toString().padStart(3, '0')}`;
    }

    const delay = ms => new Promise(resolve => setTimeout(resolve, ms));

    function toggleInfo(index) {
        const detailsDiv = document.getElementById(`details-${index}`);
        detailsDiv.style.display = detailsDiv.style.display === "block" ? "none" : "block";
    }

    async function startCompiler() {
        const btn = document.getElementById("run-btn");
        const status = document.getElementById("status-container");
        const resultsDiv = document.getElementById("results");
        const totalBox = document.getElementById("total");
        const routeWinnerDisplay = document.getElementById("route-winner");
        const progressBar = document.getElementById("progress-bar");
        const progressFill = document.getElementById("progress-fill");
        
        let countInput = parseInt(document.getElementById("run-count").value);
        if (isNaN(countInput) || countInput < 1 || countInput > 150) {
            alert("Please enter a valid number between 1 and 150."); return;
        }

        btn.disabled = true;
        resultsDiv.innerHTML = "";
        totalBox.style.display = "none";
        routeWinnerDisplay.style.display = "none";
        progressBar.style.display = "block";
        progressFill.style.width = "0%";
        
        let bestEdges = {};
        Object.keys(EDGES).forEach(key => bestEdges[key] = null);

        try {
            status.innerText = `Fetching the leaderboard...`;
            const lbRes = await fetch("https://api.mcsrranked.com/record-leaderboard");
            if (!lbRes.ok) throw new Error("Failed to fetch leaderboard.");
            const lbJson = await lbRes.json();
            
            let matches = lbJson.data.slice(0, countInput).map((match, index) => ({
                id: match.id, rank: index + 1
            }));

            for (let i = 0; i < matches.length; i++) {
                let match = matches[i];
                status.innerText = `Analyzing run data... (${i + 1}/${matches.length})`;
                progressFill.style.width = `${((i + 1) / matches.length) * 100}%`;

                try {
                    const matchRes = await fetch(`https://api.mcsrranked.com/matches/${match.id}`);
                    if (!matchRes.ok) continue;
                    
                    const matchJson = await matchRes.json();
                    const matchData = matchJson.data || {};
                    const winnerUuid = matchData.result?.uuid;
                    if (!winnerUuid) continue;

                    let playerName = "Unknown";
                    (matchData.players || []).forEach(p => { if (p.uuid === winnerUuid) playerName = p.nickname; });

                    let matchDateStr = "Unknown";
                    if (matchData.date) {
                        matchDateStr = new Date(matchData.date * 1000).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
                    }
                    let finalMatchTime = matchData.result?.time;
                    
                    let pTimes = { "world_spawn": 0 };
                    (matchData.timelines || []).forEach(t => {
                        if (t.uuid === winnerUuid && t.type && t.time != null) {
                            if (!(t.type in pTimes) || t.time < pTimes[t.type]) {
                                pTimes[t.type] = t.time;
                            }
                        }
                    });

                    // Build the strict, filtered timeline for the info panel
                    let sortedSplits = [{ name: "World Spawn", time: 0 }];
                    for (let [type, time] of Object.entries(pTimes)) {
                        // Only add it to the timeline if it's one of our main milestones
                        if (type !== "world_spawn" && DISPLAY_NAMES[type]) {
                            sortedSplits.push({ name: DISPLAY_NAMES[type], time: time });
                        }
                    }
                    // Sort them chronologically
                    sortedSplits.sort((a, b) => a.time - b.time);

                    Object.keys(EDGES).forEach(edgeKey => {
                        let startId = EDGES[edgeKey].start;
                        let targetId = EDGES[edgeKey].target;

                        if (startId in pTimes && targetId in pTimes) {
                            let duration = pTimes[targetId] - pTimes[startId];
                            if (duration >= 0) {
                                if (bestEdges[edgeKey] == null || duration < bestEdges[edgeKey].duration) {
                                    bestEdges[edgeKey] = {
                                        duration: duration,
                                        startTime: pTimes[startId],
                                        targetTime: pTimes[targetId],
                                        player: playerName,
                                        runRank: match.rank,
                                        startName: DISPLAY_NAMES[startId],
                                        targetName: DISPLAY_NAMES[targetId],
                                        matchDate: matchDateStr,
                                        matchFinalTime: finalMatchTime,
                                        fullTimeline: sortedSplits
                                    };
                                }
                            }
                        }
                    });
                } catch (e) {}
                await delay(50);
            }

            status.innerText = "Calculations complete.";
            setTimeout(() => { status.innerText = ""; progressBar.style.display = "none"; }, 1500);

            let bastionFirstSum = 0, fortressFirstSum = 0;
            let validBastion = true, validFortress = true;

            ROUTE_BASTION_FIRST.forEach(edge => { if (!bestEdges[edge]) validBastion = false; else bastionFirstSum += bestEdges[edge].duration; });
            ROUTE_FORTRESS_FIRST.forEach(edge => { if (!bestEdges[edge]) validFortress = false; else fortressFirstSum += bestEdges[edge].duration; });

            let winningRoute = [], winningSum = 0, winningName = "";

            if (validBastion && (!validFortress || bastionFirstSum <= fortressFirstSum)) {
                winningRoute = ROUTE_BASTION_FIRST; winningSum = bastionFirstSum; winningName = "Bastion First Path";
            } else if (validFortress) {
                winningRoute = ROUTE_FORTRESS_FIRST; winningSum = fortressFirstSum; winningName = "Fortress First Path";
            } else {
                status.innerText = "Error: Not enough data for a complete run.";
                btn.disabled = false; return;
            }

            // Render cards
            winningRoute.forEach((edgeKey, index) => {
                const info = bestEdges[edgeKey];
                const card = document.createElement("div");
                card.className = "card";
                
                // Build the HTML for the beautifully spaced timeline
                let timelineHTML = info.fullTimeline.map(split => `
                    <div class="timeline-step">
                        <span class="step-name">${split.name}</span>
                        <span class="step-time">${msToStr(split.time)}</span>
                    </div>
                `).join('');

                card.innerHTML = `
                    <div class="card-main">
                        <div class="card-info-group">
                            <div class="card-title">${info.targetName}</div>
                            <div class="card-runner">Runner: ${info.player} (from ${info.startName})</div>
                        </div>
                        <div class="card-time-group">
                            <div class="card-time">${msToStr(info.duration)}</div>
                            <button class="info-btn" onclick="toggleInfo(${index})">i</button>
                        </div>
                    </div>
                    
                    <div class="card-details" id="details-${index}">
                        <div class="stats-row">
                            <div class="stat-item">
                                <span class="stat-label">Date Played</span>
                                <span class="stat-value">${info.matchDate}</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">Match Time</span>
                                <span class="stat-value">${msToStr(info.matchFinalTime)}</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">Leaderboard</span>
                                <span class="stat-value">Rank #${info.runRank}</span>
                            </div>
                        </div>
                        
                        <div class="section-title">Milestone Timeline</div>
                        <div class="run-timeline">
                            ${timelineHTML}
                        </div>
                    </div>
                `;
                resultsDiv.appendChild(card);
            });

            // Display total box at the bottom
            document.getElementById("total-time-display").innerText = msToStr(winningSum);
            routeWinnerDisplay.innerText = `Fastest Routing Strategy: ${winningName}`;
            routeWinnerDisplay.style.display = "block";
            totalBox.style.display = "block";

        } catch (error) {
            status.innerText = `Error: ${error.message}`;
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
